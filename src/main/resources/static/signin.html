<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FeastForward — Sign up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-600">FeastForward</h1>
      <div class="space-x-4">
        <a href="index.html" class="text-gray-700 hover:text-green-600">Home</a>
        <a href="signin.html" class="text-gray-700 hover:text-green-600">Sign in</a>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-grow flex items-start justify-center py-12 px-4">
    <div class="w-full max-w-3xl bg-white rounded-xl shadow-lg p-6">

      <!-- Header -->
      <header class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Create your account</h2>
        <p class="text-gray-600 mt-2">Join FeastForward as a donor, recipient, or volunteer</p>
      </header>

      <!-- Role Tabs -->
      <div id="role-tabs" class="flex justify-center gap-3 mb-6">
        <button data-role="donor" class="role-tab px-4 py-2 rounded-lg bg-green-600 text-white font-semibold">Donor</button>
        <button data-role="recipient" class="role-tab px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Recipient</button>
        <button data-role="volunteer" class="role-tab px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Volunteer</button>
      </div>

      <!-- Register Form -->
      <form id="signup-form" class="space-y-4">
        <input type="hidden" name="role" id="role" value="donor" />

        <div>
          <label class="block text-sm font-medium text-gray-700">Full Name</label>
          <input id="name" type="text" placeholder="Enter your full name" required
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input id="email" type="email" placeholder="Enter your email" required
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Phone Number</label>
          <input id="phone" type="text" placeholder="+91XXXXXXXXXX"
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <div id="donor-fields">
          <label class="block text-sm font-medium text-gray-700">Business / Event Name (optional)</label>
          <input id="business" type="text" placeholder="e.g., Tasty Bites Restaurant"
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input id="password" type="password" placeholder="Enter a strong password" required
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
          <input id="confirm-password" type="password" placeholder="Re-enter password" required
            class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <!-- Feedback -->
        <p id="feedback" class="text-center text-sm text-red-600 mt-2 hidden"></p>
        <p id="success" class="text-center text-sm text-green-600 mt-2 hidden"></p>

        <!-- Submit -->
        <div class="pt-3">
          <button type="submit"
            class="w-full bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700">
            Sign up
          </button>
        </div>
      </form>

      <p class="text-center text-sm text-gray-600 mt-4">
        Already have an account?
        <a href="signin.html" class="text-green-600 hover:underline">Sign in</a>
      </p>
    </div>
  </main>

  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
      <p>© 2025 FeastForward. All rights reserved.</p>
      <p class="mt-2 md:mt-0">Working towards <span class="font-semibold">SDG 2: Zero Hunger</span>.</p>
    </div>
  </footer>

  <script>
    const tabs = document.querySelectorAll('.role-tab');
    const roleInput = document.getElementById('role');
    const donorFields = document.getElementById('donor-fields');
    const form = document.getElementById('signup-form');
    const feedback = document.getElementById('feedback');
    const success = document.getElementById('success');

    let activeRole = "donor";

    function setActiveRole(role) {
      activeRole = role;
      roleInput.value = role;

      tabs.forEach(t => {
        if (t.dataset.role === role) {
          t.classList.add('bg-green-600', 'text-white');
          t.classList.remove('bg-gray-100', 'text-gray-700');
        } else {
          t.classList.remove('bg-green-600', 'text-white');
          t.classList.add('bg-gray-100', 'text-gray-700');
        }
      });

      donorFields.style.display = (role === 'donor') ? 'block' : 'none';
    }

    tabs.forEach(t => t.addEventListener('click', () => setActiveRole(t.dataset.role)));
    setActiveRole(activeRole);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      feedback.classList.add('hidden');
      success.classList.add('hidden');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();
      const business = document.getElementById('business').value.trim();

      if (password !== confirmPassword) {
        feedback.textContent = "Passwords do not match!";
        feedback.classList.remove("hidden");
        return;
      }

      const userData = {
        name,
        email,
        phone,
        password,
        role: activeRole.toUpperCase(),
        businessName: (activeRole === "donor") ? business : null
      };

      try {
        const response = await fetch("http://localhost:8080/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(userData)
        });

        if (response.ok) {
          success.textContent = "Registration successful! Redirecting to sign-in...";
          success.classList.remove("hidden");
          form.reset();
          setTimeout(() => {
            window.location.href = "signin.html";
          }, 2000);
        } else {
          const errorData = await response.json();
          feedback.textContent = errorData.message || "Registration failed!";
          feedback.classList.remove("hidden");
        }
      } catch (err) {
        feedback.textContent = "Server error. Please try again later.";
        feedback.classList.remove("hidden");
        console.error(err);
      }
    });
  </script>
</body>
</html>
