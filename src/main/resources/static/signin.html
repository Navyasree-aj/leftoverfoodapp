<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <!-- Logo Only -->
      <a href="index.html" class="flex items-center">
        <div class="h-32 flex items-center">
          <img src="images/logo.png" alt="Logo" class="max-h-full w-auto">
        </div>
      </a>
    </div>
  </nav>

  <!-- Login Form -->
  <main class="flex-grow flex items-center justify-center px-4">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md mt-8">

      <h2 class="text-2xl font-bold text-center text-green-600 mb-6">Login</h2>

      <form id="loginForm" class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-gray-700">Email</label>
          <input type="email" id="email" name="email" required
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <!-- Remember Me + Forgot Password -->
        <div class="flex items-center justify-between text-sm text-gray-600">
          <label class="flex items-center">
            <input type="checkbox" class="mr-2"> Remember Me
          </label>
          <a href="#" class="text-green-600 hover:underline">Forgot Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit"
          class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
          Login
        </button>
      </form>

      <p class="text-sm text-center text-gray-600 mt-4">
        Don’t have an account?
        <a href="signup.html" class="text-green-600 hover:underline">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
      <p>© 2025 FeastForward. All rights reserved.</p>
      <p class="mt-2 md:mt-0">Working towards <span class="font-semibold">SDG 2: Zero Hunger</span>.</p>
    </div>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:8080/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          const role = data.role;
          if (role === "DONOR") window.location.href = "donor.html";
          else if (role === "RECEIVER") window.location.href = "receiver.html";
          else if (role === "ADMIN") window.location.href = "admin-dashboard.html";
          else alert("Unknown role");
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Server error. Try again later.");
        console.error(err);
      }
    });
  </script>

</body>
</html>
