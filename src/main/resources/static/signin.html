<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FeastForward — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- NAVBAR (small) -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-600">FeastForward</h1>
      <div class="space-x-4">
        <a href="index.html" class="text-gray-700 hover:text-green-600">Home</a>
        <a href="donor.html" class="text-gray-700 hover:text-green-600">Donor</a>
        <a href="recipient.html" class="text-gray-700 hover:text-green-600">Recipient</a>
        <a href="volunteer.html" class="text-gray-700 hover:text-green-600">Volunteer</a>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-grow flex items-start justify-center py-12 px-4">
    <div class="w-full max-w-3xl bg-white rounded-xl shadow-lg p-6">

      <!-- Header -->
      <header class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Sign in to FeastForward</h2>
        <p class="text-gray-600 mt-2">Choose your role and sign in to continue</p>
      </header>

      <!-- Role Tabs -->
      <div id="role-tabs" class="flex justify-center gap-3 mb-6">
        <button data-role="donor" class="role-tab px-4 py-2 rounded-lg bg-green-600 text-white font-semibold">Donor</button>
        <button data-role="recipient" class="role-tab px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Recipient</button>
        <button data-role="volunteer" class="role-tab px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Volunteer</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <!-- Role hidden input (sent to backend) -->
        <input type="hidden" name="role" id="role" value="donor" />

        <!-- Role-specific optional field -->
        <div id="donor-fields" class="">
          <label class="block text-sm font-medium text-gray-700">Business / Event Name (optional)</label>
          <input id="business" name="business" type="text" placeholder="e.g., Tasty Bites Restaurant"
                 class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" />
        </div>

        <!-- common identification -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Email or Phone</label>
          <input id="identifier" name="identifier" type="text" placeholder="email@example.com or +91XXXXXXXXXX"
                 class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password"
                 class="mt-1 block w-full border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-200" required />
        </div>

        <!-- Remember + forgot -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2">
            <input id="remember" type="checkbox" class="h-4 w-4 rounded border-gray-300" />
            <span class="text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-green-600 hover:underline">Forgot password?</a>
        </div>

        <!-- Submit -->
        <div class="pt-3">
          <button id="login-btn" type="submit"
                  class="w-full bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700">
            Sign in
          </button>
        </div>

        <!-- Inline feedback -->
        <p id="feedback" class="text-center text-sm text-red-600 mt-2 hidden"></p>
      </form>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
      <p>© 2025 FeastForward. All rights reserved.</p>
      <p class="mt-2 md:mt-0">Working towards <span class="font-semibold">SDG 2: Zero Hunger</span>.</p>
    </div>
  </footer>

  <!-- JS: role switching + simple submit (client-side only) -->
  <script>
(function () {
  const tabs = document.querySelectorAll('.role-tab');
  const roleInput = document.getElementById('role');
  const donorFields = document.getElementById('donor-fields');
  const form = document.getElementById('login-form');
  const feedback = document.getElementById('feedback');

  // Check query string for role (e.g. login.html?role=recipient)
  const urlParams = new URLSearchParams(window.location.search);
  let activeRole = urlParams.get("role") || "donor";

  function setActiveRole(role) {
    activeRole = role;
    roleInput.value = role;

    // update tab styles
    tabs.forEach(t => {
      if (t.dataset.role === role) {
        t.classList.add('bg-green-600', 'text-white', 'font-semibold');
        t.classList.remove('bg-gray-100', 'text-gray-700');
      } else {
        t.classList.remove('bg-green-600', 'text-white', 'font-semibold');
        t.classList.add('bg-gray-100', 'text-gray-700');
      }
    });

    // show/hide donor-only field
    donorFields.style.display = (role === 'donor') ? 'block' : 'none';
  }

  tabs.forEach(t => t.addEventListener('click', () => setActiveRole(t.dataset.role)));

  // Set initial role
  setActiveRole(activeRole);

  // Form submission
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    feedback.classList.add('hidden');

    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!identifier || !password) {
      feedback.textContent = 'Please enter both identifier and password.';
      feedback.classList.remove('hidden');
      return;
    }

    // Demo redirect (replace with server login later)
    if (activeRole === 'donor') window.location.href = 'donor.html';
    else if (activeRole === 'recipient') window.location.href = 'recipient.html';
    else window.location.href = 'volunteer.html';
  });
})();
</script>

</body>
</html>
