<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeastForward - Recent Donations</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

 <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-600">FeastForward</h1>
      <div class="space-x-6">
      <!-- <a href="donor.html" class="text-gray-700 hover:text-green-600">Donations</a>-->
        <a href="recent-donations.html" class="text-yellow-500 font-semibold">Recent Donations</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-6 py-10">
    <h2 class="text-3xl font-semibold text-center text-gray-800 mb-10">Recent Donations</h2>

    <!-- Donations Grid -->
    <section id="donationList" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
      <p class="col-span-full text-center text-gray-500 text-lg">Loading recent donations...</p>
    </section>
  </main>

 <!-- Footer -->
  <footer class="bg-gray-800 text-white py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
      <p>© 2025 FeastForward. All rights reserved.</p>
      <p class="mt-2 md:mt-0">Working towards <span class="font-semibold">SDG 2: Zero Hunger</span>.</p>
    </div>
  </footer>

  <script>
    async function loadDonations() {
      const donationList = document.getElementById('donationList');
      donationList.innerHTML = '<p class="col-span-full text-center text-gray-500 text-lg">Loading recent donations...</p>';

      try {
        const response = await fetch('http://localhost:8080/api/donations/all');
        if (!response.ok) throw new Error('Failed to fetch donations');
        const donations = await response.json();

        if (donations.length === 0) {
          donationList.innerHTML = '<p class="col-span-full text-center text-gray-500 text-lg">No recent donations yet.</p>';
          return;
        }

        donationList.innerHTML = '';

        donations.forEach(donation => {
          const card = document.createElement('div');
          card.className = "bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-lg transition transform hover:-translate-y-1";

          card.innerHTML = `
            <img src="${donation.imagePath}" alt="${donation.foodName}"
              class="w-full h-56 object-cover">
            <div class="p-5">
              <h3 class="text-xl font-semibold text-gray-800">${donation.foodName}</h3>
              <p class="text-gray-600 mt-2">Quantity: ${donation.quantity}</p>
            </div>
          `;

          donationList.appendChild(card);
        });
      } catch (error) {
        donationList.innerHTML = `<p class="col-span-full text-center text-red-500 text-lg">Error: ${error.message}</p>`;
      }
    }

    loadDonations();
  </script>
</body>
</html>
